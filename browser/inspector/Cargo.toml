[package]
name = "fletch-registry-inspector"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
fletch-registry = { path = "../../crates/fletch-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "=0.2.127"
