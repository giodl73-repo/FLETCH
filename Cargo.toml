[workspace]
members = [
    "crates/fletch-core",
    "crates/fletch-cli",
    "crates/fletch-mock-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Gio Della-Libera"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
reqwest = { version = "0.12", features = ["blocking"] }
slice-core = { git = "https://github.com/giodl73-repo/SLICE", package = "slice-core", rev = "50b63a2eefc66916e9a015a915c845c28d80773c" }
